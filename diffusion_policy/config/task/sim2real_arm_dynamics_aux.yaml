name: sim2real_arm_dynamics_aux

# Same student-input obs as sim2real_arm_dynamics_pomdp (BasePolicyCfg) — the student
# does not directly see (action_offset, action_scale). They appear ONLY as
# `aux_target` keys, separated from `obs` so the dataset returns them as
# supervision-only fields and the policy/normalizer ignore them as inputs.
shape_meta: &shape_meta
  obs:
    end_effector_pose:
      shape: [6]
      type: low_dim
    joint_pos:
      shape: [12]
      type: low_dim
    joint_vel:
      shape: [12]
      type: low_dim
    end_effector_vel_lin_ang_b:
      shape: [6]
      type: low_dim
    prev_actions:
      shape: [7]
      type: low_dim
    insertive_asset_pose:
      shape: [6]
      type: low_dim
    receptive_asset_pose:
      shape: [6]
      type: low_dim
    insertive_asset_in_receptive_asset_frame:
      shape: [6]
      type: low_dim
  action:
    shape: [7]
  aux_target:
    action_offset:
      shape: [6]
      type: low_dim
    action_scale:
      shape: [6]
      type: low_dim

task_name: &task_name sim2real_arm_dynamics_aux

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner

dataset:
  _target_: diffusion_policy.dataset.sim2real_image_dataset.Sim2RealImageMultiDataset
  dataset_config:
    - dataset_dir: ../OctiLab/datasets/0
      sampling_ratio: 0.9
  use_streaming: false
  samples_per_file_multiplier: 1.0
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  use_cache: false
  use_disk: true
