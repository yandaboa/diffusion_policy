defaults:
  - _self_
  - task: sim2real_arm_dynamics_pomdp

name: in-context-adaptation
_target_: diffusion_policy.workspace.train_mlp_image_workspace.TrainMLPImageWorkspace
output_dir: null

task_name: '${task.name}'
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 1024
n_obs_steps: 1
n_action_steps: 1
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
seed: null
iteration: null

task:
  dataset:
    return_sequences: true
      
# Two interchangeable context-augmentation strategies share this config block:
#
#   1) diffusion_policy.policy.transformer_image_policy.TransformerImagePolicy
#      - Feature-concat: prev-step action/reward are concatenated onto the
#        observation token's feature vector (shifted right by 1, zero-pad at
#        t=0). Sequence length stays T.
#
#   2) diffusion_policy.policy.interleaved_transformer_image_policy.InterleavedTransformerImagePolicy
#      - DT-style: obs / action / reward are separate tokens interleaved as
#        [obs_t, a_t, r_t, obs_{t+1}, a_{t+1}, r_{t+1}, ...]. Each token type
#        has its own projection + type embedding; causal masking keeps
#        a_t / r_t from leaking into the obs_t hidden state. Sequence length
#        becomes T * (1 + include_action + include_reward).
policy:
  _target_: diffusion_policy.policy.interleaved_transformer_image_policy.InterleavedTransformerImagePolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1
    resize_shape: null
    crop_shape: null
    random_crop: False
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  hidden_dim: 256
  hidden_depth: 4
  n_head: 4
  dropout: 0.1

  # When True, the rolled-out action at step t-1 is concatenated onto the
  # observation token at step t (normalized, zero-padded at t=0). The actual
  # rolled-out actions are read from batch['action'] / obs_dict['action'].
  include_action_in_context: True
  # When True, the received reward at step t-1 is concatenated onto the
  # observation token at step t (zero-padded at t=0). Rewards are read from
  # batch['reward'] / obs_dict['reward'] (must be present in the dataset).
  include_reward_in_context: False

  # Output head parameterization. Left unset (null) to default to the
  # historical Gaussian head (mean + log_std). Swap in another OutputHead
  # subclass to change the action parameterization without touching the
  # transformer trunk.
  output_head:
    _target_: diffusion_policy.model.head.output_head.GaussianOutputHead
    _partial_: true
    log_std_min: -5.0
    log_std_max: 2.0

dataloader:
  batch_size: 32
  num_workers: 16
  shuffle: True
  pin_memory: True
  persistent_workers: True
  prefetch_factor: 8
  drop_last: False

val_dataloader:
  batch_size: 32
  num_workers: 16
  shuffle: False
  pin_memory: True
  persistent_workers: True
  prefetch_factor: 8
  drop_last: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda"
  seed: ${seed}
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 20
  gradient_accumulate_every: 1
  gradient_clip_norm: 1.0
  use_ema: False
  freeze_encoder: False
  rollout_every: 5000
  checkpoint_every: 1000  # checkpoint every 10000 gradient steps
  val_every: 1
  sample_every: 1
  max_train_steps: null
  max_val_steps: null
  max_gradient_steps: 50000
  tqdm_interval_sec: 1.0

logging:
  project: incontext_adaptation
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: "initial"

checkpoint:
  topk:
    monitor_key: train_action_mse_error
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_action_mse_error={train_action_mse_error:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False
  pretrained_ckpt_path: null

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num} 