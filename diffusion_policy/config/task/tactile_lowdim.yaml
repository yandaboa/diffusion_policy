name: tactile_lowdim

shape_meta: &shape_meta
  obs:
    end_effector_pose:
      shape: [6]
      type: low_dim
    arm_joint_pos:
      shape: [6]
      type: low_dim
    last_arm_action:
      shape: [6]
      type: low_dim
    last_gripper_action:
      shape: [1]
      type: low_dim
    gripper_pos:
      shape: [1]
      type: low_dim
    # Contact forces dropped — UWLab's data_collection_tactile_cfg leaves the
    # *_inner_finger_contact_sensor terms commented out (TODO: replace with
    # force-torque sensors), so the zarr dataset has no contact_force keys.
    # Re-enable in shape_meta once the sensors are wired in TactileDataCollectionCfg.
    # right_inner_finger_contact_force:
    #   shape: [3]
    #   type: low_dim
    # left_inner_finger_contact_force:
    #   shape: [3]
    #   type: low_dim
  action:
    shape: [7]

task_name: &task_name sim2real_image

env_runner:
  _target_: diffusion_policy.env_runner.dummy_runner.DummyRunner

dataset:
  _target_: diffusion_policy.dataset.sim2real_image_dataset.Sim2RealImageMultiDataset
  
  dataset_config:
    - dataset_dir: datasets/tactile_pick_step0
      sampling_ratio: 0.9
  
  use_streaming: false
  samples_per_file_multiplier: 1.0
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.05
  use_cache: true
  use_disk: false
